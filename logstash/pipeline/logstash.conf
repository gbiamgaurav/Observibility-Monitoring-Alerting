# Logstash Pipeline — ingests pipeline logs → Elasticsearch
# Input: TCP (JSON logs from pipeline services) + Kafka topic
# Filter: parse, enrich, classify
# Output: Elasticsearch with daily indices

input {
  # TCP input — services can log directly here
  tcp {
    port => 5000
    codec => json_lines
    type => "pipeline_log"
  }

  # Kafka input — consume pipeline events from Kafka
  kafka {
    bootstrap_servers => "kafka:29092"
    topics => ["pipeline-logs", "genai-events", "ml-events", "agent-events"]
    codec => json
    type => "kafka_event"
    group_id => "logstash_consumer"
    consumer_threads => 2
    decorate_events => true
  }

  # Beats input — for Filebeat/Metricbeat sidecar agents
  beats {
    port => 5044
  }
}

filter {
  # Parse timestamp
  date {
    match => ["timestamp", "ISO8601", "UNIX_MS"]
    target => "@timestamp"
  }

  # Add environment metadata
  mutate {
    add_field => {
      "environment" => "production"
      "cluster" => "ai-pipelines"
    }
  }

  # Tag GenAI pipeline logs
  if [service] == "genai-pipeline" or [pipeline_type] == "genai" {
    mutate {
      add_tag => ["genai", "llm"]
    }

    # Extract Groq model info if present
    if [model] {
      mutate {
        add_field => { "llm_model" => "%{model}" }
      }
    }

    # Flag high-latency LLM calls
    if [duration_ms] and [duration_ms] > 5000 {
      mutate {
        add_tag => ["slow_llm_call"]
        add_field => { "anomaly" => "high_latency" }
      }
    }

    # Flag rate limit errors
    if [error_type] == "rate_limit_error" {
      mutate {
        add_tag => ["rate_limited"]
      }
    }
  }

  # Tag Agentic pipeline logs
  if [service] == "agentic-pipeline" or [pipeline_type] == "agentic" {
    mutate {
      add_tag => ["agentic", "llm"]
    }

    # Flag stuck agents
    if [agent_steps] and [agent_steps] > 20 {
      mutate {
        add_tag => ["agent_loop_suspected"]
        add_field => { "anomaly" => "too_many_steps" }
      }
    }
  }

  # Tag ML pipeline logs
  if [service] == "ml-pipeline" or [pipeline_type] == "ml" {
    mutate {
      add_tag => ["ml", "inference"]
    }

    # Flag low-confidence predictions
    if [prediction_confidence] and [prediction_confidence] < 0.6 {
      mutate {
        add_tag => ["low_confidence"]
        add_field => { "anomaly" => "low_model_confidence" }
      }
    }
  }

  # Classify log level
  if [level] == "ERROR" or [level] == "CRITICAL" {
    mutate {
      add_field => { "is_error" => true }
    }
  }

  # GeoIP enrichment (if client IPs are present)
  if [client_ip] {
    geoip {
      source => "client_ip"
      target => "geoip"
    }
  }
}

output {
  # Send ALL logs to Elasticsearch
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "pipeline-logs-%{+YYYY.MM.dd}"
    # Separate indices per pipeline type for easier filtering
    index => "pipeline-%{[service]}-%{+YYYY.MM.dd}"
    ilm_enabled => false
  }

  # Errors also go to a dedicated error index
  if "error" in [tags] or [level] == "ERROR" {
    elasticsearch {
      hosts => ["elasticsearch:9200"]
      index => "pipeline-errors-%{+YYYY.MM.dd}"
    }
  }

  # Debug output (comment out in production)
  # stdout { codec => rubydebug }
}
