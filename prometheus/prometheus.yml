global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s
  external_labels:
    environment: 'production'
    cluster: 'ai-pipelines'

# ── Alert Rules ─────────────────────────────────────────────────
rule_files:
  - "/etc/prometheus/alerts/genai_alerts.yml"
  - "/etc/prometheus/alerts/ml_alerts.yml"
  - "/etc/prometheus/alerts/infra_alerts.yml"

# ── AlertManager Integration ────────────────────────────────────
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

# ── Scrape Configs ──────────────────────────────────────────────
scrape_configs:

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Host system metrics
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        regex: '([^:]+):.*'
        replacement: '$1'

  # OpenTelemetry Collector self-metrics
  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8888']

  # Kafka broker metrics
  - job_name: 'kafka-exporter'
    static_configs:
      - targets: ['kafka-exporter:9308']
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'kafka_.*'
        action: keep

  # GenAI Pipeline — Groq LLM service
  - job_name: 'genai-pipeline'
    static_configs:
      - targets: ['genai-pipeline:8001']
    metrics_path: '/metrics'
    scrape_interval: 10s
    relabel_configs:
      - target_label: service
        replacement: genai-pipeline
      - target_label: pipeline_type
        replacement: genai

  # Agentic AI Pipeline
  - job_name: 'agentic-pipeline'
    static_configs:
      - targets: ['agentic-pipeline:8003']
    metrics_path: '/metrics'
    scrape_interval: 10s
    relabel_configs:
      - target_label: service
        replacement: agentic-pipeline
      - target_label: pipeline_type
        replacement: agentic

  # Traditional ML Pipeline
  - job_name: 'ml-pipeline'
    static_configs:
      - targets: ['ml-pipeline:8002']
    metrics_path: '/metrics'
    scrape_interval: 15s
    relabel_configs:
      - target_label: service
        replacement: ml-pipeline
      - target_label: pipeline_type
        replacement: ml

  # Elasticsearch metrics (via exporter sidecar port)
  - job_name: 'elasticsearch'
    static_configs:
      - targets: ['elasticsearch:9200']
    metrics_path: '/_prometheus/metrics'
